<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 22px;background:var(--bg-page);color:var(--text-body)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:0}</style></head><body><div style="display:flex;gap:14px;align-items:center">
<div style="height:38px;padding:0 16px;display:flex;align-items:center;background:var(--blue-500);color:#fff;border:1px solid var(--blue-600);border-radius:var(--radius-md);font-size:14px;font-weight:500;box-shadow:var(--shadow-sm)">Rest</div>
<div style="height:38px;padding:0 16px;display:flex;align-items:center;background:var(--blue-600);color:#fff;border:1px solid var(--blue-600);border-radius:var(--radius-md);font-size:14px;font-weight:500;box-shadow:var(--shadow-brand)">Hover</div>
<div style="height:38px;padding:0 16px;display:flex;align-items:center;background:var(--blue-600);color:#fff;border:1px solid var(--blue-700);border-radius:var(--radius-md);font-size:14px;font-weight:500;transform:translateY(.5px)">Press</div>
<div style="height:38px;padding:0 16px;display:flex;align-items:center;background:var(--blue-500);color:#fff;border:1px solid var(--blue-600);border-radius:var(--radius-md);font-size:14px;font-weight:500;box-shadow:var(--ring-focus)">Focus</div>
<div style="height:38px;padding:0 16px;display:flex;align-items:center;background:var(--blue-500);color:#fff;border:1px solid var(--blue-600);border-radius:var(--radius-md);font-size:14px;font-weight:500;opacity:.45">Disabled</div>
</div></body></html>
