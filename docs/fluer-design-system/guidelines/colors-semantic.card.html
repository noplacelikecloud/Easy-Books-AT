<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 22px;background:var(--bg-page);color:var(--text-body)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:0}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="background:var(--state-success-bg);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px 14px"><div style="font-size:13px;font-weight:600;color:var(--state-success-fg)">Success</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px">Running · Live</div><div class="lbl" style="margin-top:9px">--state-success-fg</div></div><div style="background:var(--state-warning-bg);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px 14px"><div style="font-size:13px;font-weight:600;color:var(--state-warning-fg)">Warning</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px">Degraded</div><div class="lbl" style="margin-top:9px">--state-warning-fg</div></div><div style="background:var(--state-danger-bg);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px 14px"><div style="font-size:13px;font-weight:600;color:var(--state-danger-fg)">Danger</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px">Failed</div><div class="lbl" style="margin-top:9px">--state-danger-fg</div></div><div style="background:var(--state-info-bg);border:1px solid var(--border-hairline);border-radius:var(--radius-md);padding:12px 14px"><div style="font-size:13px;font-weight:600;color:var(--state-info-fg)">Info</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px">Queued</div><div class="lbl" style="margin-top:9px">--state-info-fg</div></div>
</div></body></html>
