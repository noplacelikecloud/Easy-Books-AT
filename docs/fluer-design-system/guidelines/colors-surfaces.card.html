<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces & Text" subtitle="Semantische Aliase — in Komponenten immer diese verwenden." -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 22px;background:var(--bg-page);color:var(--text-body)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:0}</style></head><body><div style="display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start">
<div style="border:1px solid var(--border-hairline);border-radius:var(--radius-lg);overflow:hidden">
<div style="background:var(--bg-page);padding:11px 13px" class="lbl">--bg-page</div>
<div style="background:var(--surface-card);padding:11px 13px;border-top:1px solid var(--border-hairline)" class="lbl">--surface-card</div>
<div style="background:var(--surface-sunken);padding:11px 13px;border-top:1px solid var(--border-hairline)" class="lbl">--surface-sunken</div>
<div style="background:var(--surface-inverse);padding:11px 13px;border-top:1px solid var(--border-hairline)"><span class="lbl" style="color:#9a9a94">--surface-inverse</span></div>
</div>
<div style="display:grid;gap:7px">
<div style="font-size:16px;color:var(--text-strong);font-weight:600">Text strong <span class="lbl">--text-strong</span></div>
<div style="font-size:15px;color:var(--text-body)">Text body <span class="lbl">--text-body</span></div>
<div style="font-size:14px;color:var(--text-muted)">Text muted <span class="lbl">--text-muted</span></div>
<div style="font-size:13px;color:var(--text-faint)">Text faint <span class="lbl">--text-faint</span></div>
<div style="font-size:14px;color:var(--text-brand)">Text brand <span class="lbl">--text-brand</span></div>
</div></div></body></html>
